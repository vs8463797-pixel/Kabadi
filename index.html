<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Book Publication - Job Application</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;">

    <div style="background: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%;">
        
        <!-- Company Header with Logo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="logo.jpg" alt="Company Logo" style="width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 2px solid #2764ff; margin-bottom: 10px;" onerror="this.style.display='none'">
            <h2 style="color: #333; margin-bottom: 5px;">Global Book Publication</h2>
            <p style="color: #666; font-size: 14px;">Handwriting Job Application Form</p>
        </div>

        <!-- Formspree Action Link (Yahan apni Formspree ID zaroor dalein) -->
        <form action="https://formspree.io/f/your-form-id-here" method="POST" enctype="multipart/form-data">
            
            <div style="margin-bottom: 15px; text-align: center;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444; text-align: left;">Profile Photo</label>
                <input type="file" name="profile_photo" accept="image/*" onchange="previewPhoto(event)" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                
                <!-- Photo Preview Container -->
                <img id="photoPreview" src="#" alt="Photo Preview" style="display: none; width: 80px; height: 80px; object-fit: cover; border-radius: 50%; margin: 10px auto 0 auto; border: 2px solid #2764ff;" />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Father's / Husband's Name</label>
                <input type="text" name="guardian_name" placeholder="Enter father's/husband's name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Mobile Number</label>
                <input type="tel" name="mobile_number" placeholder="Enter mobile number" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">WhatsApp Mobile Number</label>
                <input type="tel" name="whatsapp_number" placeholder="Enter WhatsApp number" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Gmail Address</label>
                <input type="email" name="email" placeholder="Enter email address" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Date of Birth (DOB)</label>
                <input type="date" id="dobInput" name="dob" onchange="calculateAge()" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444;">Calculated Age</label>
                <input type="text" id="ageOutput" name="age" readonly placeholder="Age will auto-calculate" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <!-- Submit Button -->
            <button type="submit" style="width: 100%; background-color: #2764ff; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Submit & Proceed to Pay 🚀
            </button>
        </form>

        <!-- QR Code & WhatsApp Section -->
        <div style="margin-top: 25px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
            <p style="font-size: 13px; color: #555; margin-bottom: 10px;">Scan QR Code for Registration Fee Payment:</p>
            
            <img src="qrcode.jpg" alt="Payment QR Code JPG" style="width: 150px; height: 150px; object-fit: contain; border: 1px solid #ddd; border-radius: 8px; padding: 5px;" onerror="this.src='https://via.placeholder.com/150?text=Upload+qrcode.jpg'">
            
            <p style="margin-top: 15px; font-size: 13px;">
                Payment ke baad UTR screenshot ke sath yahan contact karein: <br>
                <a href="https://wa.me/919754250295" target="_blank" style="display: inline-block; margin-top: 8px; background-color: #25D366; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px;">
                    Chat on WhatsApp 💬
                </a>
            </p>
        </div>

    </div>

    <!-- JavaScript for Age Calculation & Photo Preview -->
    <script>
        // Automatic Age Calculation
        function calculateAge() {
            const dobValue = document.getElementById('dobInput').value;
            if (!dobValue) return;

            const dob = new Date(dobValue);
            const today = new Date();
            
            let age = today.getFullYear() - dob.getFullYear();
            const monthDifference = today.getMonth() - dob.getMonth();
            
            if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < dob.getDate())) {
                age--;
            }

            const ageOutput = document.getElementById('ageOutput');
            if (age >= 0) {
                ageOutput.value = age + " Years";
            } else {
                ageOutput.value = "Invalid Date";
            }
        }

        // Profile Photo Preview
        function previewPhoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('photoPreview');
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
